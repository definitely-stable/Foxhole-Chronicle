name: Bootstrap validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.112

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Pin npm
        run: npm install --global npm@11.19.1

      - name: Restore .NET
        run: dotnet restore FoxholeChronicle.slnx

      - name: Resolve web lockfile
        run: npm --prefix apps/web install --package-lock-only --ignore-scripts

      - name: Commit resolved web lockfile
        run: |
          if [ -n "$(git status --porcelain -- apps/web/package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/web/package-lock.json
            git commit -m "bootstrap: lock web dependencies"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Install web dependencies
        run: npm --prefix apps/web ci --ignore-scripts

      - name: Build .NET and generate application OpenAPI
        run: dotnet build FoxholeChronicle.slnx --no-restore

      - name: Generate web API transport types
        run: npm --prefix apps/web run api:generate

      - name: Build web
        run: npm --prefix apps/web run build

      - name: Test .NET
        run: dotnet test FoxholeChronicle.slnx --no-build --no-restore

      - name: Test web
        run: npm --prefix apps/web run test

      - name: Upload resolved web lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-package-lock
          path: apps/web/package-lock.json
          if-no-files-found: error
